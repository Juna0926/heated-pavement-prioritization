<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:42px;font-weight:700}.s{font-size:22px;fill:#667085}.h{font-size:25px;font-weight:700}.n{font-size:78px;font-weight:700;fill:#2563eb}.b{font-size:21px;fill:#475467}</style><text x="70" y="85" class="t">Random Forest Road-Priority Model</text><text x="70" y="125" class="s">2025 Gwangjin-gu Big Data Analysis Competition</text><rect x="70" y="190" width="450" height="345" rx="28" fill="#eff6ff" stroke="#93c5fd"/><text x="115" y="260" class="h">ROC-AUC</text><text x="115" y="390" class="n">0.888</text><text x="115" y="455" class="b">reported in the competition analysis</text><rect x="590" y="190" width="540" height="345" rx="28" fill="#f8fafc" stroke="#d0d5dd"/><text x="635" y="260" class="h">Decision-support interpretation</text><text x="635" y="325" class="b">Random Forest learns road-level priority patterns</text><text x="635" y="370" class="b">→ RF_probability ranks candidate roads</text><text x="635" y="415" class="b">→ top candidates receive contextual review</text><text x="635" y="470" class="b">→ engineering / policy feasibility remains separate</text><text x="70" y="610" class="s">The model supports prioritization; it does not replace field inspection or municipal engineering judgment.</text></svg>