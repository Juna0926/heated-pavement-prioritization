<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:42px;font-weight:700}.s{font-size:22px;fill:#667085}.h{font-size:23px;font-weight:700}.b{font-size:19px;fill:#475467}</style><text x="70" y="85" class="t">Expected Impact & Limits</text><text x="70" y="125" class="s">Decision support for transparent winter-road infrastructure prioritization</text><rect x="70" y="190" width="500" height="315" rx="26" fill="#ecfdf3" stroke="#86efac"/><text x="110" y="250" class="h">Expected impact</text><text x="110" y="310" class="b">• More transparent site prioritization</text><text x="110" y="355" class="b">• Efficient heated-pavement deployment</text><text x="110" y="400" class="b">• Reduced winter road-risk exposure</text><text x="110" y="445" class="b">• Extension to related road-safety decisions</text><rect x="630" y="190" width="500" height="315" rx="26" fill="#fff7ed" stroke="#fdba74"/><text x="670" y="250" class="h">Limitations reported</text><text x="670" y="310" class="b">• Public datasets have different update cycles</text><text x="670" y="355" class="b">• Coordinate / spatial preprocessing error</text><text x="670" y="400" class="b">• Limited detailed road-width information</text><text x="670" y="445" class="b">• Imbalanced road-type representation</text><text x="70" y="595" class="s">The ranking is an analytical screening result and requires engineering inspection and municipal feasibility review.</text></svg>